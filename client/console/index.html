<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GoldenLine — Operator Console</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../theme.css" />
  <link rel="stylesheet" href="console.css" />
</head>
<body class="antialiased" x-data="consoleApp()" x-init="init()" x-cloak>

  <div class="gl-console-bg" aria-hidden="true"></div>

  <!-- ─────────────────────────── top bar ─────────────────────────── -->
  <header class="gl-topbar sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-3 sm:gap-5">
      <a href="../index.html" class="flex items-center gap-2.5 shrink-0">
        <span class="gl-brand-mark text-sm">G</span>
        <span class="hidden sm:flex flex-col leading-tight">
          <span class="font-semibold tracking-tight">GoldenLine</span>
          <span class="text-[11px]" style="color:var(--gl-ink-faint)">Operator Console</span>
        </span>
      </a>

      <div class="hidden lg:flex items-center gap-2 ml-1 text-xs px-2.5 py-1.5 rounded-lg"
           style="background:var(--gl-subtle-bg);border:1px solid var(--gl-hairline);color:var(--gl-ink-dim)">
        <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4.5" width="14" height="12.5" rx="1.6"/><path d="M3 8h14M7 3v3M13 3v3"/></svg>
        <span x-text="new Date().toLocaleDateString(lang === 'en' ? undefined : lang, {weekday:'long', day:'2-digit', month:'short', year:'numeric'})"></span>
      </div>

      <div class="ml-auto flex items-center gap-2.5 sm:gap-3 text-sm">
        <span class="flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-lg"
              style="background:var(--gl-subtle-bg);border:1px solid var(--gl-hairline)">
          <span class="gl-dot" :class="apiUp ? 'gl-dot-ok' : 'gl-dot-danger'"></span>
          <span style="color:var(--gl-ink-dim)" x-text="apiUp ? t('console.apiOnline') : t('console.apiOffline')"></span>
        </span>

        <select @change="setLang($event.target.value)" class="gl-select rounded-lg px-2 py-1.5 text-xs">
          <template x-for="opt in langOptions" :key="opt.code">
            <option :value="opt.code" :selected="lang === opt.code" x-text="opt.label"></option>
          </template>
        </select>

        <template x-if="session">
          <div class="flex items-center gap-2.5 pl-2.5 sm:pl-3" style="border-left:1px solid var(--gl-hairline)">
            <span class="gl-brand-mark text-xs" style="background:linear-gradient(135deg,var(--gl-accent-soft),var(--gl-accent));color:#0d1119"
                  x-text="(session.display_name || session.user_id || '?').replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase()"></span>
            <span class="hidden md:flex flex-col leading-tight">
              <span class="text-xs font-medium" x-text="session.display_name || session.user_id"></span>
              <span class="text-[11px]" style="color:var(--gl-ink-faint)" x-text="roleLabel(viewRole)"></span>
            </span>
            <button @click="signOut()" class="gl-link text-xs" x-text="t('console.signOut')"></button>
          </div>
        </template>
      </div>
    </div>
  </header>

  <!-- ─────────────────────── checking session… ─────────────────────── -->
  <template x-if="!session && !bootFailed">
    <div class="relative z-10 flex items-center justify-center py-24 text-sm" style="color:var(--gl-ink-dim)">
      <div class="w-5 h-5 gl-spinner mr-2"></div> <span x-text="t('console.checkingSession')"></span>
    </div>
  </template>
  <template x-if="bootFailed">
    <div class="relative z-10 gl-card max-w-sm mx-auto mt-16 p-6 text-center">
      <p style="color:var(--gl-ink-dim)" x-text="t('console.notSignedIn')"></p>
      <a href="../index.html" class="gl-btn-primary mt-3 inline-block rounded-lg px-4 py-2 text-sm" x-text="t('console.goToSignIn')"></a>
    </div>
  </template>

  <!-- ─────────────────────────── main layout ─────────────────────────── -->
  <template x-if="session">
  <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8 grid grid-cols-1 md:grid-cols-[15rem_1fr] gap-6 lg:gap-8">

    <!-- sidebar nav -->
    <nav class="gl-rail space-y-1">
      <div class="gl-eyebrow px-2 pb-2" x-text="roleLabel(viewRole)"></div>
      <template x-for="item in nav()" :key="item.key">
        <button @click="go(item.key)"
          class="gl-nav-btn text-left"
          :class="screen === item.key && 'gl-nav-active'">
          <span class="inline-flex" x-html="navIcon(item.key)"></span>
          <span x-text="item.label"></span>
        </button>
      </template>
      <div class="mt-4 pt-3 text-xs px-2 leading-relaxed" style="color:var(--gl-ink-faint);border-top:1px solid var(--gl-hairline)">
        <template x-if="session?.hospital_id"><span class="gl-chip text-[11px] px-2 py-0.5" x-text="session.hospital_id"></span></template>
        <template x-if="session?.blood_bank_id"><span class="gl-chip text-[11px] px-2 py-0.5" x-text="session.blood_bank_id"></span></template>
      </div>
    </nav>

    <!-- screen area -->
    <main class="min-w-0">

      <!-- ═══════════════════════ DASHBOARD (per-role Overview) ═══════════════════════ -->
      <section x-show="screen === 'dashboard'" x-transition.opacity.duration.150ms class="space-y-5">
        <div class="flex items-end justify-between flex-wrap gap-3">
          <div>
            <div class="gl-eyebrow" x-text="t('console.dash.overview')"></div>
            <h1 class="gl-page-title mt-1" x-text="dash.hospitalName || roleLabel(viewRole)"></h1>
          </div>
          <button @click="loadDashboard()" :disabled="loading"
            class="gl-btn-secondary text-xs rounded-lg px-3 py-1.5 flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 0 1 12-5l2 2M17 10a7 7 0 0 1-12 5l-2-2"/><path d="M17 3v4h-4M3 17v-4h4"/></svg>
            <span x-text="t('console.dash.refresh')"></span>
          </button>
        </div>

        <template x-if="!dash.ready">
          <div class="flex items-center gap-2 py-16 justify-center text-sm" style="color:var(--gl-ink-faint)">
            <span class="w-4 h-4 gl-spinner"></span> <span x-text="t('console.dash.loading')"></span>
          </div>
        </template>

        <template x-if="dash.ready">
        <div class="space-y-5">
          <!-- KPI grid -->
          <div class="grid grid-cols-2 md:grid-cols-3 gap-3"
               :class="(dash.kpis||[]).length >= 6 ? 'lg:grid-cols-6' : 'lg:grid-cols-4'">
            <template x-for="(k, i) in (dash.kpis || [])" :key="i">
              <div class="gl-kpi gl-fade-up" :style="'animation-delay:' + (i * 40) + 'ms'">
                <div class="gl-kpi-top">
                  <span class="gl-kpi-label" x-text="k.label"></span>
                  <span class="gl-kpi-ico" x-html="dashIcon(k.k)"></span>
                </div>
                <div class="gl-kpi-value" x-text="k.value"></div>
                <div class="gl-kpi-sub" x-text="k.sub"></div>
              </div>
            </template>
          </div>

          <!-- ── ADMIN ── -->
          <div x-show="viewRole === 'admin'" class="gl-dash-grid">
            <div class="gl-widget gl-col-8">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.casesTrend')"></span>
                <span class="text-xs" style="color:var(--gl-ink-faint)" x-text="t('console.dash.last14')"></span></div>
              <div class="gl-widget-body"><div class="gl-chart-box" style="height:236px"><canvas id="dashTrend"></canvas></div></div>
            </div>
            <div class="gl-widget gl-col-4">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.casesByStatus')"></span></div>
              <div class="gl-widget-body">
                <div class="gl-chart-box" style="height:170px"><canvas id="dashStatus"></canvas></div>
                <div class="gl-legend">
                  <template x-for="l in dashLeg(dash.status)" :key="l.label">
                    <span class="gl-legend-item"><span class="gl-legend-swatch" :style="'background:' + l.color"></span><span x-text="l.label + ' · ' + l.value"></span></span>
                  </template>
                </div>
              </div>
            </div>
            <div class="gl-widget gl-col-4">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.fleetStatus')"></span></div>
              <div class="gl-widget-body">
                <div class="gl-chart-box" style="height:170px"><canvas id="dashFleet"></canvas></div>
                <div class="gl-legend">
                  <template x-for="l in dashLeg(dash.fleet)" :key="l.label">
                    <span class="gl-legend-item"><span class="gl-legend-swatch" :style="'background:' + l.color"></span><span x-text="l.label + ' · ' + l.value"></span></span>
                  </template>
                </div>
              </div>
            </div>
            <div class="gl-widget gl-col-8">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.bedsByHospital')"></span></div>
              <div class="gl-widget-body"><div class="gl-chart-box" style="height:210px"><canvas id="dashBeds"></canvas></div></div>
            </div>
            <div class="gl-widget gl-col-6">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.recentActivity')"></span>
                <button @click="go('cases')" class="gl-link text-xs" x-text="t('console.common.openArrow')"></button></div>
              <div class="gl-widget-body gl-feed">
                <template x-for="(f, i) in (dash.feed || [])" :key="i">
                  <div class="gl-feed-item"><span class="gl-feed-ico" x-html="dashIcon(f.icon)"></span>
                    <div class="gl-feed-main"><div class="gl-feed-title" x-text="f.title"></div><div class="gl-feed-meta" x-text="f.meta"></div></div></div>
                </template>
                <p x-show="!(dash.feed||[]).length" class="text-xs py-4" style="color:var(--gl-ink-faint)" x-text="t('console.common.none')"></p>
              </div>
            </div>
            <div class="gl-widget gl-col-6">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.hospitalsAttention')"></span>
                <button @click="go('beds')" class="gl-link text-xs" x-text="t('console.common.openArrow')"></button></div>
              <div class="gl-widget-body gl-feed">
                <template x-for="(h, i) in (dash.lowBeds || [])" :key="i">
                  <div class="gl-feed-item"><span class="gl-feed-ico" x-html="dashIcon('beds')"></span>
                    <div class="gl-feed-main"><div class="gl-feed-title" x-text="h.name"></div>
                    <div class="gl-feed-meta"><span x-text="h.gen"></span> <span x-text="t('console.unit.gen')"></span> · <span x-text="h.icu"></span> <span x-text="t('console.unit.icuFree')"></span></div></div></div>
                </template>
                <p x-show="!(dash.lowBeds||[]).length" class="text-xs py-4" style="color:var(--gl-ink-faint)" x-text="t('console.dash.allHealthy')"></p>
              </div>
            </div>
          </div>

          <!-- ── HOSPITAL ── -->
          <div x-show="viewRole === 'hospital'" class="gl-dash-grid">
            <div class="gl-widget gl-col-4">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.bedMix')"></span></div>
              <div class="gl-widget-body">
                <div class="gl-chart-box" style="height:180px"><canvas id="dashBedRing"></canvas></div>
                <div class="gl-legend">
                  <template x-for="l in dashLeg(dash.bedRing)" :key="l.label">
                    <span class="gl-legend-item"><span class="gl-legend-swatch" :style="'background:' + l.color"></span><span x-text="l.label + ' · ' + l.value"></span></span>
                  </template>
                </div>
              </div>
            </div>
            <div class="gl-widget gl-col-8">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.censusByStatus')"></span></div>
              <div class="gl-widget-body"><div class="gl-chart-box" style="height:200px"><canvas id="dashCensus"></canvas></div></div>
            </div>
            <div class="gl-widget gl-col-4">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.staffStatus')"></span></div>
              <div class="gl-widget-body">
                <div class="gl-chart-box" style="height:170px"><canvas id="dashStaff"></canvas></div>
                <div class="gl-legend">
                  <template x-for="l in dashLeg(dash.staff)" :key="l.label">
                    <span class="gl-legend-item"><span class="gl-legend-swatch" :style="'background:' + l.color"></span><span x-text="l.label + ' · ' + l.value"></span></span>
                  </template>
                </div>
              </div>
            </div>
            <div class="gl-widget gl-col-4">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.incomingCases')"></span>
                <button @click="go('incoming')" class="gl-link text-xs" x-text="t('console.common.openArrow')"></button></div>
              <div class="gl-widget-body gl-feed">
                <template x-for="(f, i) in (dash.feed || [])" :key="i">
                  <div class="gl-feed-item"><span class="gl-feed-ico" x-html="dashIcon(f.icon)"></span>
                    <div class="gl-feed-main"><div class="gl-feed-title" x-text="f.title"></div><div class="gl-feed-meta" x-text="f.meta"></div></div></div>
                </template>
                <p x-show="!(dash.feed||[]).length" class="text-xs py-4" style="color:var(--gl-ink-faint)" x-text="t('console.incoming.empty')"></p>
              </div>
            </div>
            <div class="gl-widget gl-col-4">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.lowStock')"></span>
                <button @click="go('inventory')" class="gl-link text-xs" x-text="t('console.common.openArrow')"></button></div>
              <div class="gl-widget-body gl-feed">
                <template x-for="(it, i) in (dash.lowStockItems || [])" :key="i">
                  <div class="gl-feed-item"><span class="gl-feed-ico" x-html="dashIcon('inventory')"></span>
                    <div class="gl-feed-main"><div class="gl-feed-title" x-text="it.name"></div><div class="gl-feed-meta" x-text="it.qty"></div></div>
                    <span class="gl-badge gl-badge-rose" x-text="t('console.inventory.lowStock')"></span></div>
                </template>
                <p x-show="!(dash.lowStockItems||[]).length" class="text-xs py-4" style="color:var(--gl-ink-faint)" x-text="t('console.dash.stockOk')"></p>
              </div>
            </div>
          </div>

          <!-- ── CONTROL ROOM ── -->
          <div x-show="viewRole === 'controlroom'" class="gl-dash-grid">
            <div class="gl-widget gl-col-6">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.flagsByType')"></span></div>
              <div class="gl-widget-body">
                <div class="gl-chart-box" style="height:180px"><canvas id="dashFlagTypes"></canvas></div>
                <div class="gl-legend">
                  <template x-for="l in dashLeg(dash.flagTypes)" :key="l.label">
                    <span class="gl-legend-item"><span class="gl-legend-swatch" :style="'background:' + l.color"></span><span x-text="l.label + ' · ' + l.value"></span></span>
                  </template>
                </div>
              </div>
            </div>
            <div class="gl-widget gl-col-6">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.fleetStatus')"></span></div>
              <div class="gl-widget-body">
                <div class="gl-chart-box" style="height:180px"><canvas id="dashFleet"></canvas></div>
                <div class="gl-legend">
                  <template x-for="l in dashLeg(dash.fleet)" :key="l.label">
                    <span class="gl-legend-item"><span class="gl-legend-swatch" :style="'background:' + l.color"></span><span x-text="l.label + ' · ' + l.value"></span></span>
                  </template>
                </div>
              </div>
            </div>
            <div class="gl-widget gl-col-12">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.recentFlags')"></span>
                <button @click="go('flags')" class="gl-link text-xs" x-text="t('console.common.openArrow')"></button></div>
              <div class="gl-widget-body gl-feed">
                <template x-for="(f, i) in (dash.feed || [])" :key="i">
                  <div class="gl-feed-item"><span class="gl-feed-ico" x-html="dashIcon(f.icon)"></span>
                    <div class="gl-feed-main"><div class="gl-feed-title" x-text="f.title"></div><div class="gl-feed-meta" x-text="f.meta"></div></div></div>
                </template>
                <p x-show="!(dash.feed||[]).length" class="text-xs py-4" style="color:var(--gl-ink-faint)" x-text="t('console.flags.empty')"></p>
              </div>
            </div>
          </div>

          <!-- ── BLOOD BANK ── -->
          <div x-show="viewRole === 'bloodbank'" class="gl-dash-grid">
            <div class="gl-widget gl-col-4">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.holdsByStatus')"></span></div>
              <div class="gl-widget-body">
                <div class="gl-chart-box" style="height:180px"><canvas id="dashHoldStatus"></canvas></div>
                <div class="gl-legend">
                  <template x-for="l in dashLeg(dash.holdStatus)" :key="l.label">
                    <span class="gl-legend-item"><span class="gl-legend-swatch" :style="'background:' + l.color"></span><span x-text="l.label + ' · ' + l.value"></span></span>
                  </template>
                </div>
              </div>
            </div>
            <div class="gl-widget gl-col-8">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.stockByGroup')"></span></div>
              <div class="gl-widget-body">
                <div x-show="dash.stock" class="gl-chart-box" style="height:190px"><canvas id="dashStock"></canvas></div>
                <p x-show="!dash.stock" class="text-xs py-8 text-center" style="color:var(--gl-ink-faint)" x-text="t('console.dash.noStockData')"></p>
              </div>
            </div>
            <div class="gl-widget gl-col-12">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.recentHolds')"></span>
                <button @click="go('holds')" class="gl-link text-xs" x-text="t('console.common.openArrow')"></button></div>
              <div class="gl-widget-body gl-feed">
                <template x-for="(f, i) in (dash.feed || [])" :key="i">
                  <div class="gl-feed-item"><span class="gl-feed-ico" x-html="dashIcon(f.icon)"></span>
                    <div class="gl-feed-main"><div class="gl-feed-title" x-text="f.title"></div><div class="gl-feed-meta" x-text="f.meta"></div></div></div>
                </template>
                <p x-show="!(dash.feed||[]).length" class="text-xs py-4" style="color:var(--gl-ink-faint)" x-text="t('console.holds.empty')"></p>
              </div>
            </div>
          </div>

          <!-- ── HELPER ── -->
          <div x-show="viewRole === 'helper'" class="gl-dash-grid">
            <div class="gl-widget gl-col-8">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.casesTrend')"></span></div>
              <div class="gl-widget-body"><div class="gl-chart-box" style="height:210px"><canvas id="dashTrend"></canvas></div></div>
            </div>
            <div class="gl-widget gl-col-4">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.casesByStatus')"></span></div>
              <div class="gl-widget-body">
                <div class="gl-chart-box" style="height:150px"><canvas id="dashStatus"></canvas></div>
                <div class="gl-legend">
                  <template x-for="l in dashLeg(dash.status)" :key="l.label">
                    <span class="gl-legend-item"><span class="gl-legend-swatch" :style="'background:' + l.color"></span><span x-text="l.label + ' · ' + l.value"></span></span>
                  </template>
                </div>
              </div>
            </div>
            <div class="gl-widget gl-col-6" x-show="dash.activeCase">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.activeCase')"></span></div>
              <div class="gl-widget-body">
                <div class="font-medium" x-text="dash.activeCase?.patient_name || t('console.common.unknownPatient')"></div>
                <span class="gl-badge mt-1.5 inline-flex" :class="statusClass(dash.activeCase?.status)" x-text="statusLabel(dash.activeCase?.status)"></span>
                <button @click="openCase(dash.activeCase.case_id)" class="gl-btn-primary rounded-lg px-3 py-1.5 text-xs mt-3 block" x-text="t('console.dash.openCase')"></button>
              </div>
            </div>
            <div class="gl-widget" :class="dash.activeCase ? 'gl-col-6' : 'gl-col-12'">
              <div class="gl-widget-head"><span class="gl-widget-title" x-text="t('console.dash.recentActivity')"></span>
                <button @click="go('cases')" class="gl-link text-xs" x-text="t('console.common.openArrow')"></button></div>
              <div class="gl-widget-body gl-feed">
                <template x-for="(f, i) in (dash.feed || [])" :key="i">
                  <button @click="f.caseId && openCase(f.caseId)" class="gl-feed-item text-left w-full"><span class="gl-feed-ico" x-html="dashIcon(f.icon)"></span>
                    <div class="gl-feed-main"><div class="gl-feed-title" x-text="f.title"></div><div class="gl-feed-meta" x-text="f.meta"></div></div></button>
                </template>
                <p x-show="!(dash.feed||[]).length" class="text-xs py-4" style="color:var(--gl-ink-faint)" x-text="t('console.cases.empty')"></p>
              </div>
            </div>
          </div>
        </div>
        </template>
      </section>

      <!-- ═══════════ HELPER / ADMIN: case list ═══════════ -->
      <section x-show="screen === 'cases'" x-transition.opacity.duration.150ms class="space-y-4">
        <div class="flex items-center justify-between">
          <h1 class="gl-page-title" x-text="t('console.cases.heading')"></h1>
          <button x-show="viewRole === 'helper'" @click="newCaseOpen = !newCaseOpen"
            class="gl-btn-primary text-sm rounded-lg px-3 py-1.5" x-text="t('console.cases.newCase')"></button>
        </div>

        <div x-show="newCaseOpen" x-transition class="gl-card p-4 space-y-3">
          <h3 class="gl-section-title" x-text="t('console.cases.startTitle')"></h3>
          <div class="grid grid-cols-2 gap-3 text-sm">
            <label class="block" style="color:var(--gl-ink-dim)"><span x-text="t('console.cases.patientName')"></span>
              <input x-model="nc.name" class="gl-input mt-1 w-full rounded-lg px-2.5 py-1.5" :placeholder="t('console.cases.optional')" /></label>
            <label class="block" style="color:var(--gl-ink-dim)"><span x-text="t('console.cases.approxAge')"></span>
              <input x-model.number="nc.age" type="number" class="gl-input mt-1 w-full rounded-lg px-2.5 py-1.5" /></label>
            <label class="block" style="color:var(--gl-ink-dim)"><span x-text="t('console.cases.gender')"></span>
              <select x-model="nc.gender" class="gl-select mt-1 w-full rounded-lg px-2.5 py-1.5">
                <option value="male" x-text="t('console.gender.male')"></option><option value="female" x-text="t('console.gender.female')"></option><option value="other" x-text="t('console.gender.other')"></option><option value="unknown" x-text="t('console.gender.unknown')"></option>
              </select></label>
            <label class="block" style="color:var(--gl-ink-dim)"><span x-text="t('console.cases.nokPhone')"></span>
              <input x-model="nc.nok" inputmode="numeric" maxlength="10"
                class="gl-input mt-1 w-full rounded-lg px-2.5 py-1.5"
                :style="nc.nok && !nokValid() ? 'border-color:var(--gl-danger)' : ''" />
              <span x-show="nc.nok && !nokValid()" class="text-xs mt-1 block" style="color:var(--gl-danger)" x-text="t('console.cases.nokInvalid')"></span>
            </label>
          </div>
          <button @click="createCase()" :disabled="loading || !nokValid()"
            class="gl-btn-primary text-sm rounded-lg px-3 py-1.5" x-text="t('console.cases.createCase')"></button>
        </div>

        <div class="gl-panel overflow-hidden">
          <table class="gl-table w-full text-sm">
            <thead><tr><th class="px-3 py-2.5 text-left" x-text="t('console.cases.colPatient')"></th><th class="px-3 py-2.5 text-left" x-text="t('console.cases.colPath')"></th><th class="px-3 py-2.5 text-left" x-text="t('console.cases.colStatus')"></th><th class="px-3 py-2.5 text-left" x-text="t('console.cases.colHospital')"></th><th class="px-3 py-2.5"></th></tr></thead>
            <tbody>
              <template x-for="c in cases" :key="c.case_id">
                <tr>
                  <td class="px-3 py-2.5" x-text="c.patient_name || t('console.common.unknownPatient')"></td>
                  <td class="px-3 py-2.5" style="color:var(--gl-ink-dim)" x-text="c.creation_path"></td>
                  <td class="px-3 py-2.5"><span class="gl-badge" :class="statusClass(c.status)" x-text="statusLabel(c.status)"></span></td>
                  <td class="px-3 py-2.5" style="color:var(--gl-ink-dim)" x-text="c.selected_hospital_id || '—'"></td>
                  <td class="px-3 py-2.5 text-right"><button @click="openCase(c.case_id)" class="gl-link" x-text="t('console.common.openArrow')"></button></td>
                </tr>
              </template>
              <tr x-show="!cases.length"><td colspan="5" class="px-3 py-8 text-center" style="color:var(--gl-ink-faint)" x-text="t('console.cases.empty')"></td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ═══════════ CASE DETAIL (helper / family / admin) ═══════════ -->
      <template x-if="screen === 'case' && ac.case">
      <section x-transition.opacity.duration.150ms class="space-y-4">
        <button @click="go(viewRole === 'family' ? 'sos' : 'cases')" class="text-sm gl-link" x-text="t('console.common.back')"></button>

        <div class="gl-card p-4">
          <div class="flex items-start justify-between">
            <div>
              <h1 class="gl-page-title" x-text="ac.case?.patient_name || t('console.common.patientUnknown')"></h1>
              <p class="text-sm mt-0.5" style="color:var(--gl-ink-dim)">
                <span x-text="t('console.case.pathLabel') + ' ' + ac.case?.creation_path"></span>
                <template x-if="ac.case?.patient_approx_age || ac.case?.patient_gender">
                  <span>
                    · <span x-text="ac.case?.patient_approx_age ? ac.case.patient_approx_age + 'y' : ''"></span>
                    <span x-text="ac.case?.patient_gender || ''"></span>
                  </span>
                </template>
                ·
                <span x-text="t('console.case.caseIdLabel')"></span> <span class="font-mono text-xs" x-text="ac.case?.case_id?.slice(0,8)"></span>
              </p>
            </div>
            <span class="gl-badge" :class="statusClass(ac.case?.status)" x-text="statusLabel(ac.case?.status)"></span>
          </div>
        </div>

        <!-- family SMS tracking link (Path B only, FR-9) -->
        <template x-if="ac.trackingLink">
          <div class="gl-card p-3 text-xs space-y-1.5">
            <div style="color:var(--gl-ink-faint)" x-text="t('console.case.trackingLinkLabel')"></div>
            <div class="flex items-center gap-2 flex-wrap">
              <a :href="trackingLinkUrl()" target="_blank" class="gl-link font-mono break-all" x-text="trackingLinkUrl()"></a>
              <button @click="copyTrackingLink()" class="gl-btn-secondary rounded px-2 py-0.5" x-text="t('console.common.copy')"></button>
            </div>
          </div>
        </template>

        <!-- live ambulance location (helper's own device GPS) -->
        <div x-show="viewRole === 'helper'" class="gl-card p-3 text-xs flex items-center gap-2" style="color:var(--gl-ink-dim)">
          <span class="w-1.5 h-1.5 rounded-full" :class="geo.coords ? 'bg-emerald-400' : 'bg-rose-400'"></span>
          <template x-if="geo.coords">
            <span>
              <span x-text="t('console.geo.live')"></span>:
              <span class="font-mono" x-text="geo.coords.lat.toFixed(4) + ', ' + geo.coords.lon.toFixed(4)"></span>
              <span x-text="'(' + t('console.geo.updatedAgo').replace('{s}', geoAgeSeconds()) + ')'"></span>
            </span>
          </template>
          <span x-show="!geo.coords && geo.supported && !geo.error" x-text="t('console.geo.waiting')"></span>
          <span x-show="!geo.supported" style="color:var(--gl-warn)" x-text="t('console.geo.unsupported')"></span>
          <span x-show="geo.error" style="color:var(--gl-warn)" x-text="t('console.geo.denied')"></span>
        </div>

        <!-- which ambulance is coming + its live position (family/admin, not helper) -->
        <div x-show="viewRole !== 'helper' && ac.ambulance" class="gl-card p-3 text-xs flex items-center gap-2" style="color:var(--gl-ink-dim)">
          <span class="w-1.5 h-1.5 rounded-full" :class="ac.ambulance?.latitude != null ? 'bg-emerald-400' : 'bg-rose-400'"></span>
          <span x-text="t('console.case.ambulanceLabel')"></span>
          <span class="" x-text="ac.ambulance?.vehicle_number + ' · ' + ac.ambulance?.driver_name"></span>
          <span x-show="ac.ambulance?.gps_timestamp" style="color:var(--gl-ink-faint)" x-text="'(' + t('console.beds.lastSynced') + ' ' + fmtTime(ac.ambulance?.gps_timestamp) + ')'"></span>
          <span x-show="ac.ambulance?.latitude == null" style="color:var(--gl-warn)" x-text="t('console.case.ambulanceNoFixYet')"></span>
        </div>

        <!-- case map: candidate hospitals before selection, route line after.
             Also shown pre-assessment when the ambulance's live position is
             already known (Path A dispatches before the helper assesses the
             patient) — otherwise family would see nothing at all until then. -->
        <div x-show="ac.assessment || ac.ambulance" class="gl-card p-2">
          <div x-ref="caseMap" class="gl-map" style="height:260px"></div>
        </div>

        <!-- step 1: symptoms -->
        <div class="gl-card p-4">
          <h3 class="gl-section-title flex items-center gap-2">
            <span class="gl-step-num" :class="ac.assessment && 'is-done'" x-text="ac.assessment ? '✓' : '1'"></span>
            <span x-text="t('console.case.step1Title')"></span>
          </h3>
          <template x-if="!ac.assessment || editSymptoms">
            <div class="mt-3 text-sm space-y-3">
              <div x-show="voice.supported" class="flex items-center gap-2">
                <button @click="toggleVoiceInput()" type="button"
                  class="rounded-lg px-3 py-1.5 text-xs flex items-center gap-1.5"
                  :class="voice.listening ? 'gl-btn-danger gl-glow-pulse' : 'gl-btn-secondary'">
                  <span x-text="voice.listening ? '● ' + t('console.voice.listening') : '🎤 ' + t('console.voice.speak')"></span>
                </button>
                <span x-show="voice.busy" class="text-xs" style="color:var(--gl-ink-faint)" x-text="t('console.voice.processing')"></span>
              </div>
              <div class="flex gap-4">
                <template x-for="lvl in ['Critical','Serious','Stable']" :key="lvl">
                  <label class="flex items-center gap-1.5" style="color:var(--gl-ink)"><input type="radio" name="crit" :value="lvl" x-model="sym.crit"><span x-text="criticalityLabel(lvl)"></span></label>
                </template>
              </div>
              <div class="flex flex-wrap gap-3">
                <template x-for="s in symptomTags()" :key="s">
                  <label class="flex items-center gap-1.5" style="color:var(--gl-ink)"><input type="checkbox" :value="s" x-model="sym.list"><span x-text="symptomLabel(s)"></span></label>
                </template>
              </div>
              <p class="text-xs" style="color:var(--gl-ink-faint)" x-text="t('console.case.noFreeText')"></p>

              <div class="pt-2" style="border-top:1px solid var(--gl-hairline)">
                <template x-if="voice.matches.length">
                  <div class="mb-2 text-xs p-2 rounded-lg" style="background:var(--gl-subtle-bg)">
                    <div style="color:var(--gl-ink-faint)" x-text="t('console.voice.heardLabel')"></div>
                    <p class="mt-0.5" style="color:var(--gl-ink)" x-html="highlightedHeardSnapshot()"></p>
                  </div>
                </template>
                <label class="block text-xs font-medium" style="color:var(--gl-ink-dim)" x-text="t('console.case.notesLabel')"></label>
                <textarea x-model="voice.transcript" rows="3"
                  :placeholder="t('console.case.notesPlaceholder')"
                  class="gl-input mt-1 w-full rounded-lg px-2.5 py-1.5 text-sm"></textarea>
                <p class="text-xs mt-1" style="color:var(--gl-ink-faint)" x-text="t('console.case.notesHint')"></p>
                <p x-show="voice.transcript" class="text-xs mt-0.5" style="color:var(--gl-gold-soft)" x-text="t('console.voice.reviewNote')"></p>
              </div>

              <button @click="logSymptoms()" :disabled="loading" class="gl-btn-primary rounded-lg px-3 py-1.5" x-text="t('console.case.saveAssessment')"></button>
            </div>
          </template>
          <template x-if="ac.assessment && !editSymptoms">
            <div class="mt-2 text-sm" style="color:var(--gl-ink-dim)">
              <span class="gl-badge gl-badge-amber" x-text="criticalityLabel(ac.assessment.criticality_level)"></span>
              <span x-text="' · ' + symptomListLabel(ac.assessment.symptom_checklist)"></span>
              <button @click="editSymptoms = true" class="ml-2 gl-link text-xs" x-text="t('console.common.edit')"></button>
              <p x-show="ac.assessment.raw_voice_transcript" class="text-xs mt-1.5 italic" style="color:var(--gl-ink-faint)">
                <span x-text="t('console.case.notesLabel') + ': '"></span><span x-text="ac.assessment.raw_voice_transcript"></span>
              </p>
            </div>
          </template>
        </div>

        <!-- case updates: append-only follow-up notes, added any time during the case -->
        <div class="gl-card p-4" x-show="ac.assessment">
          <h3 class="gl-section-title flex items-center gap-2">
            <span x-text="t('console.case.updatesTitle')"></span>
            <span class="text-xs font-normal" style="color:var(--gl-ink-faint)" x-text="notes.length ? '(' + notes.length + ')' : ''"></span>
          </h3>

          <div x-show="viewRole === 'helper'" class="mt-3 text-sm space-y-2">
            <div class="flex items-center gap-2">
              <button x-show="voice.supported" @click="toggleNoteVoiceInput()" type="button"
                class="rounded-lg px-3 py-1.5 text-xs flex items-center gap-1.5"
                :class="newNote.listening ? 'gl-btn-danger gl-glow-pulse' : 'gl-btn-secondary'">
                <span x-text="newNote.listening ? '● ' + t('console.voice.listening') : '🎤 ' + t('console.voice.speak')"></span>
              </button>
            </div>
            <textarea x-model="newNote.text" rows="2"
              :placeholder="t('console.case.updatePlaceholder')"
              class="gl-input w-full rounded-lg px-2.5 py-1.5 text-sm"></textarea>
            <button @click="addNote()" :disabled="loading || !newNote.text.trim()" class="gl-btn-secondary rounded-lg px-3 py-1.5 text-xs" x-text="t('console.case.addUpdate')"></button>
          </div>

          <ul class="mt-3 space-y-2 text-sm">
            <template x-for="n in notes" :key="n.case_note_id">
              <li class="p-2 rounded-lg" style="background:var(--gl-subtle-bg)">
                <div class="text-xs mb-0.5" style="color:var(--gl-ink-faint)" x-text="n.author_id + ' · ' + fmtTime(n.created_at)"></div>
                <p style="color:var(--gl-ink)" x-html="noteHtml(n)"></p>
              </li>
            </template>
          </ul>
          <p x-show="!notes.length" class="text-xs mt-2" style="color:var(--gl-ink-faint)" x-text="t('console.case.noUpdates')"></p>
        </div>

        <!-- step 2: ranking + selection — 3 cost classes, helper picks after asking the family -->
        <div class="gl-card p-4" x-show="ac.assessment">
          <h3 class="gl-section-title flex items-center gap-2">
            <span class="gl-step-num" :class="ac.case?.selected_hospital_id && 'is-done'" x-text="ac.case?.selected_hospital_id ? '✓' : '2'"></span>
            <span x-text="t('console.case.step2Title')"></span>
          </h3>
          <p class="text-xs mt-1" style="color:var(--gl-ink-faint)" x-text="ac.ranking?.explanation"></p>
          <p x-show="ac.ranking" class="text-xs mt-1 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full" :class="ac.ranking?.distance_source === 'live' ? 'bg-emerald-400' : 'bg-amber-400'"></span>
            <span :style="ac.ranking?.distance_source === 'live' ? 'color:var(--gl-gold-soft)' : 'color:var(--gl-ink-faint)'"
              x-text="ac.ranking?.distance_source === 'live' ? t('console.case.distanceLive') : t('console.case.distanceEstimated')"></span>
          </p>
          <p x-show="canPickHospital()" class="text-xs mt-1" style="color:var(--gl-gold-soft)" x-text="t('console.case.classesHint')"></p>
          <p x-show="viewRole === 'family' && !ac.ranking && ac.case && !ac.case.selected_hospital_id" class="text-xs mt-2 flex items-center gap-2" style="color:var(--gl-ink-dim)">
            <span class="w-3 h-3 gl-spinner"></span><span x-text="t('console.case.familyAssessing')"></span></p>
          <div class="mt-3 grid sm:grid-cols-3 gap-3">
            <template x-for="cls in ['economical','moderate','expensive']" :key="cls">
              <div class="rounded-xl p-3.5 text-sm border flex flex-col gap-1.5 transition"
                :class="canPickHospital() && ac.ranking?.classes?.[cls] ? 'gl-card-hover cursor-pointer' : ''"
                @click="canPickHospital() && ac.ranking?.classes?.[cls] && selectHospitalClass(ac.ranking.classes[cls].hospital_id)"
                :style="ac.ranking?.classes?.[cls] && ac.case?.selected_hospital_id === ac.ranking.classes[cls].hospital_id ? 'border-color:rgba(243,194,78,.55); background:rgba(243,194,78,.08)' : 'border-color:var(--gl-hairline)'">
                <div class="text-xs font-semibold uppercase tracking-wide" style="color:var(--gl-gold-soft)" x-text="t('console.case.class' + cls[0].toUpperCase() + cls.slice(1))"></div>
                <template x-if="ac.ranking?.classes?.[cls]">
                  <div class="space-y-1">
                    <div class="gl-section-title" x-text="ac.ranking.classes[cls].name"></div>
                    <span x-show="ac.ranking.classes[cls].scheme_boost_applied" class="gl-badge gl-badge-gold text-[10px]" x-text="t('console.case.schemeBoost')"></span>
                    <div class="text-xs" style="color:var(--gl-ink-dim)" x-text="hospitalLine(ac.ranking.classes[cls])"></div>
                    <div class="text-xs leading-snug pt-0.5" style="color:var(--gl-ink-faint)" x-text="ac.ranking.classes[cls].reason"></div>
                    <button x-show="canPickHospital()"
                      @click.stop="selectHospitalClass(ac.ranking.classes[cls].hospital_id)" :disabled="loading"
                      class="gl-btn-primary rounded-lg px-2.5 py-1.5 text-xs mt-1.5 w-full" x-text="t('console.case.chooseClass')"></button>
                  </div>
                </template>
                <p x-show="!ac.ranking?.classes?.[cls]" class="text-xs" style="color:var(--gl-ink-faint)" x-text="t('console.case.classUnavailable')"></p>
              </div>
            </template>
          </div>
          <p x-show="ac.ranking && !ac.ranking.ranked.length" class="text-sm mt-2" style="color:var(--gl-danger)" x-text="t('console.case.noHospitalMatch')"></p>
        </div>

        <!-- step 3: bed lock + route + blood + prep -->
        <template x-if="ac.case?.selected_hospital_id">
          <div class="grid sm:grid-cols-2 gap-4">
            <div class="gl-card p-4 text-sm">
              <h3 class="gl-section-title" x-text="t('console.case.bedLockTitle')"></h3>
              <template x-if="ac.bedLock">
                <p class="mt-1.5" style="color:var(--gl-ink-dim)">
                  <span class="gl-badge gl-badge-emerald" x-text="ac.bedLock.lock_status"></span>
                  <span x-text="' ' + bedLockLine(ac.bedLock)"></span>
                </p>
              </template>
              <p x-show="!ac.bedLock" class="mt-1.5" style="color:var(--gl-ink-faint)" x-text="t('console.case.bedReleased')"></p>
            </div>

            <div class="gl-card p-4 text-sm">
              <h3 class="gl-section-title" x-text="t('console.case.routeTitle')"></h3>
              <template x-if="ac.route">
                <div class="mt-1">
                  <div class="text-lg font-semibold gl-stat-value" x-text="t('console.unit.eta') + ' ' + ac.route.eta_min_minutes + '–' + ac.route.eta_max_minutes + ' ' + t('console.unit.min')"></div>
                  <p class="text-xs" style="color:var(--gl-gold-soft)" x-text="t('console.case.routeNote')"></p>
                  <button @click="deviate()" class="gl-btn-secondary mt-2 rounded-md px-2 py-1 text-xs" x-text="t('console.case.deviateBtn')"></button>
                  <p x-show="ac.deviationNote" class="text-xs mt-1" style="color:var(--gl-ink-dim)" x-text="ac.deviationNote"></p>
                </div>
              </template>
            </div>

            <div class="gl-card p-4 text-sm">
              <h3 class="gl-section-title" x-text="t('console.case.bloodTitle')"></h3>
              <template x-if="ac.blood">
                <p class="mt-1.5" style="color:var(--gl-ink-dim)" x-text="ac.blood.outcome === 'hospital_stock_ok' ? t('console.case.bloodOk') : t('console.case.bloodHold')"></p>
              </template>
              <p x-show="!ac.blood" class="mt-1.5" style="color:var(--gl-ink-faint)" x-text="t('console.case.bloodNotRequired')"></p>
            </div>

            <div class="gl-card p-4 text-sm">
              <h3 class="gl-section-title" x-text="t('console.case.prepTitle')"></h3>
              <ul class="mt-1.5 space-y-1">
                <template x-for="p in (ac.prep?.confirmed || [])" :key="p.prep_action_id">
                  <li style="color:var(--gl-gold-soft)">✓ <span x-text="p.label"></span></li>
                </template>
                <template x-for="p in (ac.prep?.pending || [])" :key="p.prep_action_id">
                  <li style="color:var(--gl-ink-dim)">◻ <span x-text="p.label"></span></li>
                </template>
              </ul>
              <p class="text-xs mt-1.5" style="color:var(--gl-ink-faint)" x-text="t('console.case.prepNote')"></p>
            </div>
          </div>
        </template>

        <!-- step 4: handoff code + discharge -->
        <template x-if="ac.case?.selected_hospital_id">
          <div class="gl-card p-4 space-y-3">
            <h3 class="gl-section-title" x-text="t('console.case.handoffTitle')"></h3>
            <template x-if="ac.case.status !== 'ADMITTED' && ac.case.status !== 'DISCHARGED'">
              <div>
                <button @click="genQr()" :disabled="loading" class="gl-btn-primary rounded-lg px-3 py-1.5 text-sm" x-text="t('console.case.genQr')"></button>
                <template x-if="ac.qr">
                  <div class="mt-3 inline-block">
                    <div style="color:var(--gl-ink-faint)" class="mb-1.5 text-xs" x-text="t('console.case.qrShow')"></div>
                    <div class="gl-mono-block text-2xl font-semibold tracking-widest p-3 rounded-lg text-center" x-text="ac.qr.token"></div>
                    <div class="gl-mono-block text-xs p-2 rounded-lg break-all max-w-md mt-2" x-text="ac.qr.case_id"></div>
                  </div>
                </template>
              </div>
            </template>
            <template x-if="ac.case.status === 'ADMITTED'">
              <div class="text-sm">
                <p style="color:var(--gl-gold-soft)">✓ <span x-text="t('console.case.admitted')"></span><span x-text="ac.case.admitted_by ? ' ' + t('console.unit.by') + ' ' + ac.case.admitted_by : ''"></span> <span x-text="t('console.case.admittedNote')"></span></p>
                <button @click="discharge()" :disabled="loading" class="gl-btn-secondary mt-2 rounded-lg px-3 py-1.5 text-sm" x-text="t('console.case.triggerDischarge')"></button>
              </div>
            </template>
            <template x-if="ac.case.status === 'DISCHARGED'">
              <div class="text-sm" style="color:var(--gl-ink-dim)">
                <p style="color:var(--gl-gold-soft)">✓ <span x-text="t('console.case.dischargedNote')"></span></p>
                <template x-if="ac.feedbackInvite">
                  <p class="mt-1"><span x-text="t('console.case.feedbackSent')"></span> <span class="font-mono text-xs" x-text="ac.feedbackInvite.link"></span></p>
                </template>
              </div>
            </template>
          </div>
        </template>
      </section>
      </template>

      <!-- ═══════════ FAMILY: SOS ═══════════ -->
      <section x-show="screen === 'sos'" x-transition.opacity.duration.150ms class="space-y-4 max-w-md">
        <h1 class="gl-page-title" x-text="t('console.sos.title')"></h1>

                <button @click="adjustBeds(bt[0], -1)" class="gl-btn-secondary rounded-md px-3 py-1 text-sm">−1</button>

            <span class="text-xs" style="color:var(--gl-ink-faint)" x-show="syncStatus?.last_synced_at" x-text="t('console.beds.lastSynced') + ' ' + fmtTime(syncStatus?.last_synced_at)"></span>
          </div>
          <div x-show="syncStatus?.hospital_sync_tier === 'hms_api'">
            <button @click="syncHms()" :disabled="loading" class="gl-btn-primary rounded-lg px-3 py-1.5" x-text="t('console.beds.syncHms')"></button>

          <div class="pt-3" style="border-top:1px solid var(--gl-hairline)">

            <div class="flex gap-2 items-center flex-wrap">
              <label style="color:var(--gl-ink-dim)"><span x-text="t('console.beds.generalInUse')"></span> <input x-model.number="report.gen" type="number" class="gl-input w-16 rounded-md px-2 py-1"/></label>
              <label style="color:var(--gl-ink-dim)"><span x-text="t('console.beds.icuInUse')"></span> <input x-model.number="report.icu" type="number" class="gl-input w-16 rounded-md px-2 py-1"/></label>
              <button @click="reportUsage()" :disabled="loading" class="gl-btn-secondary rounded-md px-3 py-1" x-text="t('console.beds.reportBtn')"></button>
            </div>
          </div>
          <div x-show="syncStatus?.recent_events?.length" class="pt-3 text-xs space-y-1" style="border-top:1px solid var(--gl-hairline); color:var(--gl-ink-dim)">
            <template x-for="e in (syncStatus?.recent_events || []).slice(0,5)" :key="e.sync_event_id">
              <div><span class="font-mono" style="color:var(--gl-gold-soft)" x-text="e.source"></span> · gen <span x-text="e.general_before"></span>→<span x-text="e.general_after"></span> · icu <span x-text="e.icu_before"></span>→<span x-text="e.icu_after"></span> <span style="color:var(--gl-ink-faint)" x-text="e.note"></span></div>
            </template>
          </div>
        </div>

        <!-- FR-17: room/bed categories beyond general+ICU (purely additive) -->
        <div class="gl-card p-4 text-sm space-y-3">
          <h3 class="gl-section-title" x-text="t('console.beds.categories.title')"></h3>

                <input type="number" :value="cat.total_beds" @change="saveBedCategory(cat.category_code, cat.label, $event.target.value)" class="gl-input rounded-md px-2 py-1 w-20" />
                <span class="text-xs" style="color:var(--gl-ink-faint)" x-text="t('console.beds.categories.totalBeds')"></span>
              </div>

            <p x-show="!bedCategories.length" class="text-xs" style="color:var(--gl-ink-faint)" x-text="t('console.beds.categories.empty')"></p>
          </div>
          <div class="pt-2 flex gap-2 items-center flex-wrap" style="border-top:1px solid var(--gl-hairline)">
            <input x-model="newCategory.code" :placeholder="t('console.beds.categories.codePlaceholder')" class="gl-input rounded-md px-2 py-1 w-28" />
            <input x-model="newCategory.label" :placeholder="t('console.beds.categories.labelPlaceholder')" class="gl-input rounded-md px-2 py-1 w-40" />
            <input x-model.number="newCategory.total_beds" type="number" class="gl-input rounded-md px-2 py-1 w-20" />
            <button @click="addBedCategory()" :disabled="loading" class="gl-btn-secondary rounded-md px-3 py-1" x-text="t('console.beds.categories.addBtn')"></button>
          </div>
        </div>

      <!-- ═══════════ HOSPITAL/ADMIN: patient census (FR-18) ═══════════ -->
      <section x-show="screen === 'census'" x-transition.opacity.duration.150ms class="space-y-4">
        <h1 class="gl-page-title" x-text="t('console.census.title')"></h1>

        <div x-show="session.hospital_id" class="gl-card p-4 text-sm space-y-3">
          <h3 class="gl-section-title" x-text="t('console.census.addTitle')"></h3>
          <div class="flex gap-2 items-center flex-wrap">
            <input x-model="newPatient.full_name" :placeholder="t('console.census.namePlaceholder')" class="gl-input rounded-md px-2 py-1 w-40" />
            <input x-model.number="newPatient.approx_age" type="number" :placeholder="t('console.census.agePlaceholder')" class="gl-input rounded-md px-2 py-1 w-24" />
            <select x-model="newPatient.gender" class="gl-select rounded-md px-2 py-1">
              <option value="male" x-text="t('console.gender.male')"></option>
              <option value="female" x-text="t('console.gender.female')"></option>
              <option value="other" x-text="t('console.gender.other')"></option>
            </select>
            <select x-model="newPatient.patient_type" class="gl-select rounded-md px-2 py-1">
              <option value="walk_in" x-text="t('console.census.walkIn')"></option>
              <option value="scheduled" x-text="t('console.census.scheduled')"></option>
            </select>
            <button @click="addPatient()" :disabled="loading" class="gl-btn-primary rounded-md px-3 py-1.5" x-text="t('console.census.addBtn')"></button>
          </div>
        </div>

        <div class="flex gap-2 items-center">
          <label style="color:var(--gl-ink-dim)" class="text-sm" x-text="t('console.census.filterLabel')"></label>
          <select x-model="censusFilter" @change="loadCensus()" class="gl-select rounded-md px-2 py-1 text-sm">
            <option value="" x-text="t('console.census.filterAll')"></option>
            <option value="waiting" x-text="t('console.status.waiting')"></option>
            <option value="admitted" x-text="t('console.status.admitted')"></option>
            <option value="discharged" x-text="t('console.status.discharged')"></option>
          </select>
        </div>

        <div class="space-y-2">
          <template x-for="p in census" :key="p.patient_id">
            <div class="gl-card p-3 flex items-center justify-between flex-wrap gap-2">
              <div>
                <span class="gl-section-title" x-text="p.full_name"></span>
                <span class="gl-badge ml-2" :class="statusClass(p.status)" x-text="statusLabel(p.status)"></span>
                <span class="gl-chip ml-1" x-show="p.patient_type === 'emergency_case'" x-text="t('console.census.emergencyChip')"></span>
                <span class="text-xs ml-2" style="color:var(--gl-ink-faint)" x-show="!session.hospital_id" x-text="p.hospital_id"></span>
              </div>
              <div class="flex items-center gap-2" x-show="p.status === 'waiting'">
                <input x-model="admitCategory[p.patient_id]" placeholder="general" class="gl-input rounded-md px-2 py-1 w-24 text-sm" />
                <button @click="admitPatient(p.patient_id)" :disabled="loading" class="gl-btn-secondary rounded-md px-3 py-1 text-sm" x-text="t('console.census.admitBtn')"></button>
              </div>
              <button x-show="p.status === 'admitted'" @click="dischargePatient(p.patient_id)" :disabled="loading" class="gl-btn-secondary rounded-md px-3 py-1 text-sm" x-text="t('console.census.dischargeBtn')"></button>
            </div>
          </template>
          <p x-show="!census.length" class="text-sm" style="color:var(--gl-ink-faint)" x-text="t('console.census.empty')"></p>
        </div>
      </section>

      <!-- ═══════════ HOSPITAL/ADMIN: doctor/staff roster (FR-19) ═══════════ -->
      <section x-show="screen === 'roster'" x-transition.opacity.duration.150ms class="space-y-4">
        <h1 class="gl-page-title" x-text="t('console.roster.title')"></h1>

        <div x-show="session.hospital_id" class="gl-card p-4 text-sm space-y-3">
          <h3 class="gl-section-title" x-text="t('console.roster.addTitle')"></h3>
          <div class="flex gap-2 items-center flex-wrap">
            <input x-model="newStaff.full_name" :placeholder="t('console.census.namePlaceholder')" class="gl-input rounded-md px-2 py-1 w-40" />
            <select x-model="newStaff.staff_category" class="gl-select rounded-md px-2 py-1">
              <template x-for="cat in ['doctor','nurse','technician','support','admin_staff']" :key="cat">
                <option :value="cat" x-text="t('console.staffCategory.' + cat)"></option>
              </template>
            </select>
            <input x-model="newStaff.specialty" :placeholder="t('console.roster.specialtyPlaceholder')" class="gl-input rounded-md px-2 py-1 w-36" />
            <input x-model="newStaff.phone_number" :placeholder="t('console.roster.phonePlaceholder')" class="gl-input rounded-md px-2 py-1 w-32" />
            <button @click="addStaff()" :disabled="loading" class="gl-btn-primary rounded-md px-3 py-1.5" x-text="t('console.roster.addBtn')"></button>
          </div>
        </div>

        <div class="space-y-2">
          <template x-for="s in roster" :key="s.staff_id">
            <div class="gl-card p-3 space-y-2">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <div>
                  <span class="gl-section-title" x-text="s.full_name"></span>
                  <span class="gl-chip ml-2" x-text="t('console.staffCategory.' + s.staff_category)"></span>
                  <span class="text-xs ml-1" style="color:var(--gl-ink-faint)" x-show="s.specialty" x-text="s.specialty"></span>
                  <span class="gl-badge ml-2" :class="statusClass(s.on_duty_status)" x-text="statusLabel(s.on_duty_status)"></span>
                  <span class="text-xs ml-2" style="color:var(--gl-ink-faint)" x-show="!session.hospital_id" x-text="s.hospital_id"></span>
                </div>
                <div class="flex items-center gap-2">
                  <select @change="setOnDuty(s.staff_id, $event.target.value)" class="gl-select rounded-md px-2 py-1 text-sm">
                    <option value="" disabled selected x-text="t('console.roster.setStatus')"></option>
                    <option value="on_duty" x-text="t('console.status.on_duty')"></option>
                    <option value="off_duty" x-text="t('console.status.off_duty')"></option>
                    <option value="on_leave" x-text="t('console.status.on_leave')"></option>
                  </select>
                  <button @click="removeStaff(s.staff_id)" :disabled="loading" class="gl-btn-danger rounded-md px-3 py-1 text-sm" x-text="t('console.roster.removeBtn')"></button>
                </div>
              </div>
              <div class="flex items-center gap-2 pt-2" style="border-top:1px solid var(--gl-hairline)">
                <button x-show="s.on_duty_status !== 'on_duty'" @click="clockIn(s.staff_id)" :disabled="loading" class="gl-btn-secondary rounded-md px-3 py-1 text-sm" x-text="t('console.roster.clockInBtn')"></button>
                <button x-show="s.on_duty_status === 'on_duty'" @click="clockOut(s.staff_id)" :disabled="loading" class="gl-btn-secondary rounded-md px-3 py-1 text-sm" x-text="t('console.roster.clockOutBtn')"></button>
                <button @click="toggleAttendanceHistory(s.staff_id)" class="gl-link text-sm" x-text="attendanceOpenFor === s.staff_id ? t('console.roster.hideHistory') : t('console.roster.showHistory')"></button>
              </div>
              <div x-show="attendanceOpenFor === s.staff_id" x-transition class="text-xs space-y-1 pt-1" style="color:var(--gl-ink-dim)">
                <template x-for="a in attendanceHistory" :key="a.attendance_id">
                  <div>
                    <span x-text="fmtTime(a.clock_in_at)"></span>
                    <span> → </span>
                    <span x-text="a.clock_out_at ? fmtTime(a.clock_out_at) : t('console.roster.stillIn')"></span>
                    <span class="ml-1" style="color:var(--gl-ink-faint)" x-show="a.shift_label" x-text="'(' + a.shift_label + ')'"></span>
                  </div>
                </template>
                <p x-show="!attendanceHistory.length" style="color:var(--gl-ink-faint)" x-text="t('console.roster.noHistory')"></p>
              </div>
            </div>
          </template>
          <p x-show="!roster.length" class="text-sm" style="color:var(--gl-ink-faint)" x-text="t('console.roster.empty')"></p>
        </div>
      </section>

      <!-- ═══════════ HOSPITAL/ADMIN: medical inventory (FR-21) ═══════════ -->
      <section x-show="screen === 'inventory'" x-transition.opacity.duration.150ms class="space-y-4">
        <h1 class="gl-page-title" x-text="t('console.inventory.title')"></h1>

        <div x-show="session.hospital_id" class="gl-card p-4 text-sm space-y-3">
          <h3 class="gl-section-title" x-text="t('console.inventory.addTitle')"></h3>
          <div class="flex gap-2 items-center flex-wrap">
            <input x-model="newInvItem.item_name" :placeholder="t('console.inventory.namePlaceholder')" class="gl-input rounded-md px-2 py-1 w-40" />
            <select x-model="newInvItem.category" class="gl-select rounded-md px-2 py-1">
              <template x-for="cat in ['medicine','consumable','equipment','ppe','other']" :key="cat">
                <option :value="cat" x-text="t('console.invCategory.' + cat)"></option>
              </template>
            </select>
            <input x-model="newInvItem.unit" :placeholder="t('console.inventory.unitPlaceholder')" class="gl-input rounded-md px-2 py-1 w-24" />
            <input x-model.number="newInvItem.quantity_on_hand" type="number" :placeholder="t('console.inventory.qtyPlaceholder')" class="gl-input rounded-md px-2 py-1 w-24" />
            <input x-model.number="newInvItem.low_stock_threshold" type="number" :placeholder="t('console.inventory.thresholdPlaceholder')" class="gl-input rounded-md px-2 py-1 w-28" />
            <button @click="addInventoryItem()" :disabled="loading" class="gl-btn-primary rounded-md px-3 py-1.5" x-text="t('console.inventory.addBtn')"></button>
          </div>
        </div>

        <div class="space-y-2">
          <template x-for="i in inventory" :key="i.item_id">
            <div class="gl-card p-3 flex items-center justify-between flex-wrap gap-2">
              <div>
                <span class="gl-section-title" x-text="i.item_name"></span>
                <span class="gl-chip ml-2" x-text="t('console.invCategory.' + i.category)"></span>
                <span class="gl-badge ml-2" :class="i.is_low_stock ? 'gl-badge-rose' : 'gl-badge-emerald'" x-text="i.quantity_on_hand + ' ' + i.unit"></span>
