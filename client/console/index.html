                <span class="text-xs ml-2" style="color:var(--gl-ink-faint)" x-show="!session.hospital_id" x-text="i.hospital_id"></span>
              </div>
              <div class="flex items-center gap-2" x-show="session.hospital_id">
                <button @click="adjustInventory(i.item_id, 1, 'restock')" :disabled="loading" class="gl-btn-secondary rounded-md px-3 py-1 text-sm">+1</button>
                <button @click="adjustInventory(i.item_id, -1, 'consumed')" :disabled="loading" class="gl-btn-secondary rounded-md px-3 py-1 text-sm">−1</button>
              </div>
            </div>
          </template>
          <p x-show="!inventory.length" class="text-sm" style="color:var(--gl-ink-faint)" x-text="t('console.inventory.empty')"></p>
        </div>
      </section>

      <!-- ═══════════ HOSPITAL: rule-based fuzzy import (FR-22) ═══════════ -->
      <section x-show="screen === 'import'" x-transition.opacity.duration.150ms class="space-y-4">
        <h1 class="gl-page-title" x-text="t('console.import.title')"></h1>
        <p class="text-sm" style="color:var(--gl-ink-dim)" x-text="t('console.import.intro')"></p>

        <template x-if="!session.hospital_id">
          <p class="text-sm" style="color:var(--gl-ink-faint)" x-text="t('console.import.hospitalOnly')"></p>
        </template>

        <template x-if="session.hospital_id">
          <div class="space-y-4">
            <div class="gl-card p-4 text-sm space-y-3">
              <div class="flex items-center gap-2 flex-wrap">
                <label style="color:var(--gl-ink-dim)" x-text="t('console.import.targetLabel')"></label>
                <select x-model="importTargetTable" @change="resetImport()" class="gl-select rounded-md px-2 py-1">
                  <template x-for="tbl in ['patients','hospital_staff','hospital_inventory_items','bed_categories']" :key="tbl">
                    <option :value="tbl" x-text="t('console.import.target.' + tbl)"></option>
                  </template>
                </select>
              </div>

              <div class="flex items-center gap-2 flex-wrap pt-2" style="border-top:1px solid var(--gl-hairline)">
                <input type="file" accept=".csv" x-ref="importFileInput" class="text-xs" style="color:var(--gl-ink-dim)" />
                <button @click="previewImportFile($refs.importFileInput)" :disabled="loading" class="gl-btn-secondary rounded-md px-3 py-1.5 text-sm" x-text="t('console.import.previewFileBtn')"></button>
              </div>

              <div class="flex items-center gap-2 flex-wrap pt-2" style="border-top:1px solid var(--gl-hairline)">
                <input x-model="importSheetUrl" placeholder="https://docs.google.com/spreadsheets/d/…" class="gl-input flex-1 rounded-lg px-2.5 py-1.5" />
                <button @click="previewImportSheet()" :disabled="loading" class="gl-btn-secondary rounded-md px-3 py-1.5 text-sm" x-text="t('console.import.previewSheetBtn')"></button>
              </div>
            </div>

            <div x-show="importReport" class="gl-card p-4 text-sm space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="gl-section-title" x-text="t('console.import.reviewTitle')"></h3>
                <span class="text-xs" style="color:var(--gl-ink-faint)" x-text="importReport?.row_count + ' ' + t('console.import.rowsFound')"></span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-xs">
                  <thead>
                    <tr style="color:var(--gl-ink-faint)">
                      <th class="text-left pb-1 pr-3" x-text="t('console.import.colSource')"></th>
                      <th class="text-left pb-1 pr-3" x-text="t('console.import.colSample')"></th>
                      <th class="text-left pb-1 pr-3" x-text="t('console.import.colConfidence')"></th>
                      <th class="text-left pb-1" x-text="t('console.import.colField')"></th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="col in (importReport?.columns || [])" :key="col.source_column">
                      <tr style="border-top:1px solid var(--gl-hairline)">
                        <td class="py-1.5 pr-3" style="color:var(--gl-ink)" x-text="col.source_column"></td>
                        <td class="py-1.5 pr-3" style="color:var(--gl-ink-faint)" x-text="(col.sample_values || []).join(', ')"></td>
                        <td class="py-1.5 pr-3" style="color:var(--gl-ink-faint)" x-text="col.matched_field ? Math.round(col.confidence * 100) + '%' : '—'"></td>
                        <td class="py-1.5">
                          <select x-model="importMapping[col.source_column]" class="gl-select rounded-md px-2 py-1 text-xs">
                            <option :value="null" x-text="t('console.import.ignoreColumn')"></option>
                            <template x-for="f in importTargetFields()" :key="f">
                              <option :value="f" x-text="f"></option>
                            </template>
                          </select>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <div class="flex items-center gap-2 pt-2" style="border-top:1px solid var(--gl-hairline)">
                <button @click="commitImport()" :disabled="loading" class="gl-btn-primary rounded-md px-3 py-1.5 text-sm" x-text="t('console.import.confirmBtn')"></button>
                <button @click="discardImport()" :disabled="loading" class="gl-btn-danger rounded-md px-3 py-1.5 text-sm" x-text="t('console.import.discardBtn')"></button>
              </div>
            </div>

            <div x-show="importResult" class="gl-card p-4 text-sm space-y-2">
              <div class="">
                <span x-text="t('console.import.importedCount')"></span>
                <span class="gl-section-title" x-text="importResult?.imported"></span>
              </div>
              <template x-if="importResult?.skipped?.length">
                <div class="space-y-1">
                  <div style="color:var(--gl-ink-dim)" x-text="t('console.import.skippedLabel')"></div>
                  <template x-for="s in importResult.skipped" :key="s.row">
                    <div class="text-xs" style="color:var(--gl-ink-faint)">
                      <span x-text="t('console.import.rowLabel') + ' ' + (s.row + 1) + ': '"></span>
                      <span x-text="s.reason"></span>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>
      </section>

      <!-- ═══════════ HOSPITAL: incoming cases ═══════════ -->
      <section x-show="screen === 'incoming'" x-transition.opacity.duration.150ms class="space-y-4">
        <div class="flex items-end justify-between flex-wrap gap-2">
          <h1 class="gl-page-title" x-text="t('console.incoming.title')"></h1>
          <div class="flex items-center gap-2 text-xs" style="color:var(--gl-ink-dim)">
            <label class="flex items-center gap-1.5"><input type="checkbox" x-model="incomingShowClosed"> <span x-text="t('console.incoming.showClosed')"></span></label>
          </div>
        </div>

        <!-- ── the managed case detail — shown FIRST so a click on "Manage" is obvious ── -->
        <template x-if="hc.case">
          <div class="gl-card p-4 space-y-4" x-ref="hospDetail" x-transition>
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <button @click="hc = {}" class="gl-link text-sm" x-text="t('console.incoming.backToList')"></button>
              <span class="gl-badge" :class="statusClass(hc.case.status)" x-text="statusLabel(hc.case.status)"></span>
            </div>
            <div class="flex items-center justify-between">
              <h3 class="gl-section-title" x-text="t('console.incoming.casePrefix') + ' ' + (hc.case.patient_name || t('console.common.unknownPatient'))"></h3>
              <span class="font-mono text-xs" style="color:var(--gl-ink-faint)" x-text="hc.case.case_id?.slice(0,8)"></span>
            </div>

            <div x-show="hc.assessment?.raw_voice_transcript" class="text-sm p-3 rounded-lg" style="background:rgba(242,193,78,.08); border:1px solid rgba(242,193,78,.25)">
              <div class="text-xs font-medium mb-1" style="color:var(--gl-gold-soft)" x-text="t('console.incoming.notesLabel')"></div>
              <p style="color:var(--gl-ink)" x-text="hc.assessment?.raw_voice_transcript"></p>
            </div>

            <div x-show="hc.notes?.length" class="text-sm p-3 rounded-lg" style="background:var(--gl-subtle-bg)">
              <div class="text-xs font-medium mb-1.5" style="color:var(--gl-ink-dim)" x-text="t('console.incoming.updatesLabel')"></div>
              <ul class="space-y-1.5">
                <template x-for="n in (hc.notes || [])" :key="n.case_note_id">
                  <li>
                    <div class="text-xs" style="color:var(--gl-ink-faint)" x-text="fmtTime(n.created_at)"></div>
                    <p style="color:var(--gl-ink)" x-html="noteHtml(n)"></p>
                  </li>
                </template>
              </ul>
            </div>

            <div>
              <div class="text-sm font-medium mb-1.5" style="color:var(--gl-ink-dim)" x-text="t('console.incoming.prepTitle')"></div>
              <ul class="space-y-1.5 text-sm">
                <template x-for="p in (hc.prep?.confirmed || [])" :key="p.prep_action_id">
                  <li style="color:var(--gl-gold-soft)">✓ <span x-text="p.label"></span> <span class="text-xs" style="color:var(--gl-ink-faint)" x-text="t('console.unit.by') + ' ' + p.confirmed_by"></span></li>
                </template>
                <template x-for="p in (hc.prep?.pending || [])" :key="p.prep_action_id">
                  <li class="flex items-center gap-2">
                    <button @click="confirmPrep(p.prep_action_id)" :disabled="loading" class="gl-btn-secondary rounded px-2 py-0.5 text-xs" x-text="t('console.common.confirm')"></button>
                    <span style="color:var(--gl-ink)" x-text="p.label"></span>
                    <span class="text-xs" style="color:var(--gl-ink-faint)" x-text="p.suggested_department"></span>
                  </li>
                </template>
              </ul>
            </div>

            <div class="pt-3" style="border-top:1px solid var(--gl-hairline)">
              <div class="text-sm font-medium mb-1.5" style="color:var(--gl-ink-dim)" x-text="t('console.incoming.qrScanTitle')"></div>
              <div class="flex gap-2 items-end flex-wrap">
                <label class="text-xs" style="color:var(--gl-ink-faint)"><span x-text="t('console.incoming.caseIdLabel')"></span><input x-model="scan.caseId" class="gl-input mt-0.5 w-64 rounded-lg px-2.5 py-1.5 font-mono text-xs"/></label>
                <label class="text-xs" style="color:var(--gl-ink-faint)"><span x-text="t('console.incoming.tokenLabel')"></span><input x-model="scan.token" class="gl-input mt-0.5 w-72 rounded-lg px-2.5 py-1.5 font-mono text-xs"/></label>
                <button @click="scanQr()" :disabled="loading" class="gl-btn-primary rounded-lg px-3 py-1.5 text-sm" x-text="t('console.incoming.scanAdmit')"></button>
              </div>
              <p x-show="hc.admitOk" class="text-sm mt-2" style="color:var(--gl-gold-soft)" x-text="t('console.incoming.admittedNote')"></p>
            </div>
          </div>
        </template>

        <!-- ── the list ── -->
        <div class="space-y-2.5">
          <template x-for="c in hospIncomingList()" :key="c.case_id">
            <div class="gl-card p-4 flex items-center justify-between gap-3 flex-wrap"
                 :style="hc.case && hc.case.case_id === c.case_id ? 'border-color:rgba(243,194,78,.5)' : ''">
              <div>
                <span class="gl-section-title" x-text="c.patient_name || t('console.common.patientUnknown')"></span>
                <span class="gl-badge ml-2" :class="statusClass(c.status)" x-text="statusLabel(c.status)"></span>
                <span class="text-xs ml-2" style="color:var(--gl-ink-faint)" x-text="t('console.case.pathLabel') + ' ' + c.creation_path"></span>
              </div>
              <button @click="openHospCase(c.case_id)"
                class="gl-btn-secondary rounded-lg px-3 py-1.5 text-xs"
                x-text="hc.case && hc.case.case_id === c.case_id ? t('console.incoming.managing') : t('console.incoming.manage')"></button>
            </div>
          </template>
          <p x-show="!hospIncomingList().length" class="gl-empty" x-text="t('console.incoming.empty')"></p>
        </div>
      </section>

      <!-- ═══════════ BLOOD BANK: holds ═══════════ -->
      <section x-show="screen === 'holds'" x-transition.opacity.duration.150ms class="space-y-4">
        <h1 class="gl-page-title"><span x-text="t('console.holds.title')"></span><template x-if="session?.blood_bank_id"><span> — <span x-text="session.blood_bank_id"></span></span></template></h1>
        <div class="space-y-3">
          <template x-for="h in holds" :key="h.blood_bank_hold_id">
            <div class="gl-card p-4 text-sm flex items-center justify-between">
              <div>
                <span x-show="!session?.blood_bank_id" class="gl-badge gl-badge-slate mr-2" x-text="h.blood_bank_id"></span>
                <span style="color:var(--gl-ink)" x-text="(h.blood_group || 'O-') + ' × ' + h.units_requested + ' ' + t('console.unit.units')"></span>
                <span style="color:var(--gl-ink-faint)" x-text="' · ' + t('console.holds.forHospital') + ' ' + h.hospital_id"></span>
                <span class="gl-badge ml-2" :class="h.hold_status === 'pending' ? 'gl-badge-amber' : (h.hold_status === 'confirmed' ? 'gl-badge-emerald' : 'gl-badge-rose')" x-text="h.hold_status"></span>
              </div>
              <div x-show="h.hold_status === 'pending'" class="flex gap-2">
                <button @click="decideHold(h.blood_bank_hold_id, 'confirm')" :disabled="loading" class="gl-btn-primary rounded px-3 py-1" x-text="t('console.common.confirm')"></button>
                <button @click="decideHold(h.blood_bank_hold_id, 'reject')" :disabled="loading" class="gl-btn-secondary rounded px-3 py-1" x-text="t('console.common.reject')"></button>
              </div>
            </div>
          </template>
          <p x-show="!holds.length" class="text-sm" style="color:var(--gl-ink-faint)" x-text="t('console.holds.empty')"></p>
        </div>
      </section>

      <!-- ═══════════ CONTROL ROOM ═══════════ -->
      <section x-show="screen === 'flags'" x-transition.opacity.duration.150ms class="space-y-4">
        <div class="flex items-center justify-between">
          <h1 class="gl-page-title" x-text="t('console.flags.title')"></h1>
          <button @click="runScan()" :disabled="loading" class="gl-btn-primary text-sm rounded-lg px-3 py-1.5" x-text="t('console.flags.runScan')"></button>
        </div>
        <p class="text-sm" style="color:var(--gl-ink-dim)" x-text="t('console.flags.description')"></p>
        <div class="space-y-3">
          <template x-for="f in flags" :key="f.flag_id">
            <div class="gl-card p-4 text-sm">
              <div class="flex items-center gap-2">
                <span class="gl-badge" :class="{'gl-badge-amber': f.flag_type==='anomaly','gl-badge-rose': f.flag_type==='conflict','gl-badge-sky': f.flag_type==='reconciliation'}" x-text="f.flag_type"></span>
                <span class="gl-badge gl-badge-slate" x-text="f.status"></span>
                <span class="text-xs ml-auto" style="color:var(--gl-ink-faint)" x-text="'→ ' + f.escalated_to"></span>
              </div>
              <p class="mt-2" style="color:var(--gl-ink)" x-text="f.details"></p>
              <div x-show="f.status !== 'resolved'" class="mt-2 flex gap-2">
                <input x-model="resolveNotes[f.flag_id]" :placeholder="t('console.flags.notePlaceholder')" class="gl-input flex-1 rounded-lg px-2.5 py-1 text-xs"/>
                <button @click="resolveFlag(f.flag_id)" :disabled="loading" class="gl-btn-secondary rounded px-3 py-1 text-xs whitespace-nowrap" x-text="t('console.flags.resolveBtn')"></button>
              </div>
              <p x-show="f.status === 'resolved'" class="mt-1.5 text-xs" style="color:var(--gl-gold-soft)" x-text="t('console.flags.resolvedByPrefix') + ' ' + f.resolved_by + (f.resolution_note ? ' — ' + f.resolution_note : '')"></p>
            </div>
          </template>
          <p x-show="!flags.length" class="text-sm" style="color:var(--gl-ink-faint)" x-text="t('console.flags.empty')"></p>
        </div>
      </section>

      <section x-show="screen === 'oversight'" x-transition.opacity.duration.150ms class="space-y-6">
        <h1 class="gl-page-title" x-text="t('console.oversight.title')"></h1>
        <div>
          <h3 class="font-medium text-sm mb-2" style="color:var(--gl-ink-dim)" x-text="t('console.oversight.conflictsTitle')"></h3>
          <div class="gl-panel divide-y text-sm" style="--tw-divide-opacity:1; border-color:var(--gl-hairline)">
            <template x-for="c in conflicts" :key="c.conflict_log_id">
              <div class="px-3 py-2.5" style="color:var(--gl-ink); border-color:var(--gl-hairline)" x-text="conflictLine(c)"></div>
            </template>
            <div x-show="!conflicts.length" class="px-3 py-4" style="color:var(--gl-ink-faint)" x-text="t('console.common.none')"></div>
          </div>
        </div>
        <div>
          <h3 class="font-medium text-sm mb-2" style="color:var(--gl-ink-dim)" x-text="t('console.oversight.rateLimitTitle')"></h3>
          <div class="gl-panel divide-y text-sm" style="border-color:var(--gl-hairline)">
            <template x-for="r in rateFlags" :key="r.rate_limit_flag_id">
              <div class="px-3 py-2.5" style="color:var(--gl-ink); border-color:var(--gl-hairline)" x-text="rateFlagLine(r)"></div>
            </template>
            <div x-show="!rateFlags.length" class="px-3 py-4" style="color:var(--gl-ink-faint)" x-text="t('console.common.none')"></div>
          </div>
        </div>
        <div>
          <h3 class="font-medium text-sm mb-2" style="color:var(--gl-ink-dim)" x-text="t('console.oversight.deletionsTitle')"></h3>
          <div class="gl-panel divide-y text-sm" style="border-color:var(--gl-hairline)">
            <template x-for="d in deletions" :key="d.deletion_request_id">
              <div class="px-3 py-2.5 flex items-center justify-between" style="border-color:var(--gl-hairline)">
                <span style="color:var(--gl-ink)" x-text="deletionLine(d)"></span>
                <button x-show="d.status === 'pending' && viewRole === 'admin'" @click="processDeletion(d.deletion_request_id)" class="gl-btn-secondary rounded px-2 py-0.5 text-xs" x-text="t('console.oversight.processBtn')"></button>
              </div>
            </template>
            <div x-show="!deletions.length" class="px-3 py-4" style="color:var(--gl-ink-faint)" x-text="t('console.common.none')"></div>
          </div>
        </div>
      </section>

      <!-- ═══════════ ADMIN: hospitals ═══════════ -->
      <section x-show="screen === 'hospitals'" x-transition.opacity.duration.150ms class="space-y-4">
        <h1 class="gl-page-title" x-text="t('console.hospitals.title')"></h1>
        <div class="gl-panel overflow-hidden text-sm">
          <table class="gl-table w-full">
            <thead><tr>
              <th class="px-3 py-2.5 text-left" x-text="t('console.hospitals.colHospital')"></th><th class="px-3 py-2.5 text-left" x-text="t('console.hospitals.colTier')"></th><th class="px-3 py-2.5 text-left" x-text="t('console.hospitals.colBeds')"></th><th class="px-3 py-2.5 text-left" x-text="t('console.hospitals.colCostTier')"></th>
            </tr></thead>
            <tbody>
              <template x-for="h in hospitals" :key="h.hospital_id">
                <tr>
                  <td class="px-3 py-2.5" style="color:var(--gl-ink)" x-text="h.name"></td>
                  <td class="px-3 py-2.5">
                    <select @change="setTier(h.hospital_id, $event.target.value)" class="gl-select rounded px-1.5 py-1 text-xs">
                      <template x-for="t2 in ['hms_api','google_sheets','manual_counter']" :key="t2">
                        <option :value="t2" :selected="h.hospital_sync_tier === t2" x-text="t2"></option>
                      </template>
                    </select>
                  </td>
                  <td class="px-3 py-2.5" style="color:var(--gl-ink)" x-text="h.bed_count_by_type.general + ' / ' + h.bed_count_by_type.ICU"></td>
                  <td class="px-3 py-2.5" style="color:var(--gl-ink-dim)" x-text="h.cost_tier"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div class="gl-card p-4 text-sm space-y-2" style="border-color:rgba(244,63,94,.35)">
          <h3 class="gl-section-title" x-text="t('console.reset.title')"></h3>
          <p style="color:var(--gl-ink-dim)" x-text="t('console.reset.note')"></p>
          <template x-if="!resetConfirming">
            <button @click="resetConfirming = true" class="gl-btn-danger rounded-lg px-3 py-1.5" x-text="t('console.reset.button')"></button>
          </template>
          <template x-if="resetConfirming">
            <div class="flex items-center gap-2">
              <span style="color:var(--gl-danger)" x-text="t('console.reset.confirmPrompt')"></span>
              <button @click="resetDemoData()" :disabled="loading" class="gl-btn-danger rounded-lg px-3 py-1.5" x-text="t('console.reset.confirmButton')"></button>
              <button @click="resetConfirming = false" class="gl-btn-secondary rounded-lg px-3 py-1.5" x-text="t('console.common.cancel')"></button>
            </div>
          </template>
        </div>
      </section>

      <!-- ═══════════ ADMIN / CONTROL ROOM: map overview ═══════════ -->
      <section x-show="screen === 'map'" x-transition.opacity.duration.150ms class="space-y-4">
        <h1 class="gl-page-title" x-text="t('console.map.title')"></h1>
        <div class="flex flex-wrap gap-2 text-xs">
          <span class="gl-chip flex items-center gap-1.5"><span class="w-2 h-2 rounded-full" style="background:#f2c14e"></span><span x-text="t('console.map.legendHospital')"></span></span>
          <span class="gl-chip flex items-center gap-1.5"><span class="w-2 h-2 rounded-full" style="background:#e11d48"></span><span x-text="t('console.map.legendBlood')"></span></span>
          <span class="gl-chip flex items-center gap-1.5"><span class="w-2 h-2 rounded-full" style="background:#f59e0b"></span><span x-text="t('console.ambulanceStatus.en_route_to_pickup')"></span></span>
          <span class="gl-chip flex items-center gap-1.5"><span class="w-2 h-2 rounded-full" style="background:#f2c14e"></span><span x-text="t('console.ambulanceStatus.en_route_to_hospital')"></span></span>
          <span class="gl-chip flex items-center gap-1.5"><span class="w-2 h-2 rounded-full" style="background:#64748b"></span><span x-text="t('console.map.legendIdle')"></span></span>
          <span class="gl-chip flex items-center gap-1.5"><span class="w-2 h-2 rounded-full" style="background:#e11d48"></span><span x-text="t('console.map.staleGps')"></span></span>
        </div>
        <div class="gl-card p-2">
          <div x-ref="overviewMap" class="gl-map" style="height:520px"></div>
        </div>
      </section>

    </main>
  </div>
  </template>

  <!-- ─────────────────────────── toasts ─────────────────────────── -->
  <div class="fixed bottom-4 right-4 z-50 space-y-2 w-80">
    <template x-for="t in toasts" :key="t.id">
      <div x-transition class="gl-toast"
        :class="t.kind === 'error' ? 'gl-toast-error' : (t.kind === 'ok' ? 'gl-toast-ok' : '')"
        x-text="t.msg"></div>
    </template>
  </div>

  <script src="map.js"></script>
  <script src="charts.js"></script>
  <script src="console.js"></script>
</body>
</html>
