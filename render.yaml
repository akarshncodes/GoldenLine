# render.yaml — GoldenLine Blueprint
# Defines both services so Render creates them together with one click.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─── 1. FastAPI backend ──────────────────────────────────────────────────────
  - type: web
    name: goldenline-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: GoldenLine
      - key: ENV
        value: production
      - key: API_PORT
        value: "10000"           # Render assigns port 10000 by default
      - key: FORCE_HTTPS
        value: "true"
      - key: SEED_DEMO
        value: "true"            # seed demo accounts on first boot
      - key: AUTH_SECRET
        generateValue: true      # Render auto-generates a secure random secret
      - key: DATABASE_URL
        fromDatabase:
          name: goldenline-db
          property: connectionString

  # ─── 2. Vanilla JS frontend (Static Site) ────────────────────────────────────
  - type: web
    name: goldenline-client
    runtime: static
    rootDir: client
    plan: free
    # Inject the backend URL into every HTML file at build time so the browser
    # JS picks it up via window.GOLDENLINE_API (set in index.html / login.html etc.)
    # The sed command appends a <script> tag right before </head> in each HTML file.
    buildCommand: |
      BACKEND_URL="https://goldenline-api.onrender.com"
      SNIPPET="<script>window.GOLDENLINE_API='${BACKEND_URL}';</script>"
      find . -name "*.html" | while read f; do
        sed -i "s|</head>|${SNIPPET}</head>|g" "$f"
      done
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ─── PostgreSQL database ──────────────────────────────────────────────────────
databases:
  - name: goldenline-db
    databaseName: goldenline
    user: goldenline
    plan: free              # 90-day free trial, 1 GB storage
